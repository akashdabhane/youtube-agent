<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YouTube AI</title>
    <link rel="stylesheet" href="sidebar.css">
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">
            🤖
        </div>

        <div>
            <h2>YouTube AI</h2>
            <span>Creator Intelligence</span>
        </div>
    </div>

    <div class="actions">

        <button class="action-btn">
            📝 Summary
        </button>

        <button class="action-btn">
            🎯 Audience
        </button>

        <button class="action-btn">
            📈 Growth
        </button>

        <button class="action-btn">
            🖼 Thumbnail
        </button>

    </div>

    <div id="chatContainer">

        <div class="ai-message">
            👋 Ask anything about this video.
        </div>

        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div id="response" class="ai-message">
            <!-- AI response will be displayed here -->


        </div>

    </div>

    <div class="input-area">

        <textarea
            id="question"
            placeholder="Ask about this video..."
        ></textarea>

        <button id="askBtn">
            ➤
        </button>

    </div>

</div>

<script src="sidebar.js"></script>

</body>
</html>
